name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      demo-server:
        image: golang:1.23-alpine
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          PORT: 8080

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Start demo server (Go version)
      run: |
        cd testserver
        go mod init testserver 2>/dev/null || true
        go build -o testserver main.go
        ./testserver &
        sleep 2
        curl -f http://localhost:8080/health || exit 1

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Build
      run: go build -v ./...

    - name: Run unit tests
      run: go test -v -race -coverprofile=coverage.out ./...
      env:
        TEST_GRAPHQL_URL: http://localhost:8080/graphql

    - name: Run comparison tests against demo server
      run: go test -v -run=TestFunctionalParity ./...
      env:
        TEST_GRAPHQL_URL: http://localhost:8080/graphql

    - name: Run integration tests
      run: go test -v -run=TestSchemaDumping ./...
      env:
        TEST_GRAPHQL_URL: http://localhost:8080/graphql

    - name: Upload coverage
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: ./coverage.out
        flags: unittests
        fail_ci_if_error: false

  python-comparison:
    name: Python Comparison
    runs-on: ubuntu-latest

    services:
      demo-server:
        image: golang:1.23-alpine
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          PORT: 8080

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Start demo server
      run: |
        cd testserver
        go mod init testserver 2>/dev/null || true
        go build -o testserver main.go
        ./testserver &
        sleep 2
        curl -f http://localhost:8080/health || exit 1

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Clone Python GraphQLmap
      run: |
        git clone --depth 1 https://github.com/swisskyrepo/GraphQLmap ../GraphQLmap
        cd ../GraphQLmap
        pip install -r requirements.txt 2>/dev/null || true

    - name: Run Python comparison tests
      run: go test -v -run=TestPythonComparison ./...
      env:
        TEST_GRAPHQL_URL: http://localhost:8080/graphql

    - name: Test Go implementation manually
      run: |
        curl -s -X POST http://localhost:8080/graphql \
          -H "Content-Type: application/json" \
          -d '{"query": "{ __typename }"}'

    - name: Create Python test script
      run: |
        cat > /tmp/python_test.py << 'PYEOF'
        import requests
        resp = requests.post('http://localhost:8080/graphql', json={'query': '{ __typename }'})
        print(resp.json())
        PYEOF

    - name: Test Python implementation manually
      run: python3 /tmp/python_test.py

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

    - name: Run golangci-lint
      run: golangci-lint run --timeout=5m

  benchmark:
    name: Benchmarks
    runs-on: ubuntu-latest

    services:
      demo-server:
        image: golang:1.23-alpine
        ports:
          - 8080:8080
        options: >-
          --health-cmd "wget -q --spider http://localhost:8080/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          PORT: 8080

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'
        cache: true

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Start demo server
      run: |
        cd testserver
        go mod init testserver 2>/dev/null || true
        go build -o testserver main.go
        ./testserver &
        sleep 2
        curl -f http://localhost:8080/health || exit 1

    - name: Run benchmarks
      run: go test -bench=. -benchmem -count=3 -run=^$ ./... | tee benchmark_results.txt
      env:
        TEST_GRAPHQL_URL: http://localhost:8080/graphql

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: benchmark_results.txt
        retention-days: 30

    - name: Check performance regression
      run: |
        if [ -s benchmark_results.txt ]; then
          echo "Benchmarks completed successfully"
          cat benchmark_results.txt
        else
          echo "No benchmark results generated"
          exit 1
        fi

  build-cross-platform:
    name: Cross-Platform Build
    runs-on: ubuntu-latest
    needs: [test, lint, benchmark, python-comparison]

    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: darwin
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        go build -v -o graphqlmap-go-${{ matrix.goos }}-${{ matrix.goarch }}
        if [ "${{ matrix.goos }}" = "windows" ]; then
          mv graphqlmap-go-${{ matrix.goos }}-${{ matrix.goarch }} graphqlmap-go-${{ matrix.goos }}-${{ matrix.goarch }}.exe
        fi

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: graphqlmap-go-${{ matrix.goos }}-${{ matrix.goarch }}
        path: graphqlmap-go-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
        retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-cross-platform]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.23'

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: ./binaries

    - name: Create release archives
      run: |
        cd binaries
        for dir in */; do
          cd "$dir"
          zip -r ../${dir%/}.zip .
          cd ..
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: binaries/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
